<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1915;
        background: #f3efe6;
      }
      header {
        padding: 12px 14px 8px;
        border-bottom: 1px solid rgba(28, 25, 21, 0.1);
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      p {
        margin: 8px 14px 12px;
        color: rgba(28, 25, 21, 0.7);
      }
      ol {
        margin: 0 14px 14px;
        padding-left: 18px;
        color: rgba(28, 25, 21, 0.75);
      }
      li {
        margin: 4px 0;
      }
      .ok {
        color: #0f6e56;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Shotflow → 豆包</h1>
    </header>
    <p class="ok">插件已启用。</p>
    <ol>
      <li>Chrome 先登录豆包网页版</li>
      <li>打开 Shotflow 分镜第 4 步</li>
      <li>点卡片上的「一键发送到豆包」</li>
      <li>插件会打开豆包「新对话」，点底栏「视频生成」，再用左侧「+」按图序挂参考图并贴提示词</li>
    </ol>
    <p>成片请从豆包下载后，回传到对应镜头。</p>
  </body>
</html>
